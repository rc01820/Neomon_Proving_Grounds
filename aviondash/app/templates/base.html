<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvionDash — Neomon Proving Grounds</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="logo">
                <div class="logo-mark">&#x2708;</div>
                <div>
                    <div class="logo-title">AvionDash</div>
                    <div class="logo-sub">Aviation Operations &middot; Neomon Proving Grounds</div>
                </div>
            </div>
            <div class="header-status">
                {% if effects %}
                <span class="status-dot status-fault"></span>
                <span class="status-text">{{ effects|length }} active fault{{ "s" if effects|length != 1 }}</span>
                {% else %}
                <span class="status-dot status-ok"></span>
                <span class="status-text">All systems nominal</span>
                {% endif %}
            </div>
        </header>
        <nav class="app-nav">
        <a href="/" class="nav-tab {% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/systems" class="nav-tab {% if active_page == 'systems' %}active{% endif %}">ATC Systems</a>
        <a href="/fleet" class="nav-tab {% if active_page == 'fleet' %}active{% endif %}">Fleet Mgmt</a>
        <a href="/faults" class="nav-tab {% if active_page == 'faults' %}active{% endif %}">Fault Console</a>
        </nav>
        <main class="app-main">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
